<section id="subscribe" class="wrap section">
  <div class="coupon">
    <div class="coupon__in">
      <div class="stack-8">
        <span class="kicker">Free of charge</span>
        <h2>Send for the In-Brief</h2>
        <p class="muted">One letter, [how often]: what I’m reading, cooking and leaving on the shelf. No spam, nothing to sell.</p>
      </div>
      <form data-signup>
        <label for="signup-email">Your email address</label>
        <div class="field-row">
          <input id="signup-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
          <button class="btn btn--accent" type="submit">Post it to me</button>
        </div>
        <p class="form-status" data-status role="status"></p>
      </form>
    </div>
  </div>
</section>
